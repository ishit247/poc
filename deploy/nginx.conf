server {
  listen 80;
  root /usr/share/nginx/html;

  # Security headers for the counter and the console. A header, not a <meta>: browsers ignore frame-ancestors in a
  # meta tag. No location below may use add_header, or it drops these (nginx does not merge add_header levels).
  # The API's own image responses send a stricter CSP, which a browser also applies (both policies must pass).
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # /api/x -> API /x. Host is passed through: the API picks the tenant's branding from it.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
